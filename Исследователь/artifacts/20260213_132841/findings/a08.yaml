    - "Данные о выручке Hagerty Media как отдельного сегмента (не Marketplace) недоступны публично"
    - "Конкретные цифры по Substack-авторам на автомобильную тему: не найдено успешных кейсов с раскрытой выручкой"
    - "Road & Track новая стратегия — не нашлось специфических данных по редакционной трансформации"
    - "DriveShare (аренда P2P коллекционных авто от Hagerty) — упомянут в годовом отчёте, но цифры по выручке отсутствуют"
