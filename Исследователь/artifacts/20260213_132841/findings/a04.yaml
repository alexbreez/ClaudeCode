  source_diversity: 0.85
  has_contradictions: true
  contradictions:
    - "MotorTrend+ закрыт как неудача (масштаб недостаточен для WBD), но его выручка достигла 9-значных цифр — это успех с точки зрения медиа-трансформации"
    - "Freemium через YouTube работал для привлечения подписчиков, но одновременно ограничивал готовность платить у широкой аудитории"
  gaps:
    - "Точные цифры числа подписчиков MotorTrend+ на момент закрытия (2024) не публиковались"
    - "ARPU MotorTrend+ не раскрывался отдельно (входил в общую выручку WBD)"
    - "Конверсия бесплатного YouTube-трафика в платных подписчиков MotorTrend+ (%) не публиковалась"
    - "Данные по Car and Driver и Road & Track digital paywall — нет публичных цифр по подписчикам"
    - "Операционная рентабельность Consumer Reports по направлению automotive в отчётности не выделяется"
    - "Retention rate подписчиков автомобильных изданий отсутствует в публичных источниках"
