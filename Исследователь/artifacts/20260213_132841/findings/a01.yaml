    - "Данные по трафику The Drive, Road & Track, автомобильных YouTube-каналов (Carwow, Doug DeMuro) не найдены в этом раунде"
    - "Данные KBB (Kelley Blue Book) по трафику и выручке — KBB принадлежит Cox Automotive, данные не публичны"
    - "Актуальные данные по подписчикам Motor Trend OnDemand (после 2017 года) отсутствуют"
    - "UK-специфичные игроки (Autocar, What Car?, Auto Express) не вошли в выборку"
